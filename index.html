<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luna Game Prototype</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="wrap"><div class="panel"><h2 style="margin:0">Luna Game — Canonical Prototype</h2><div class="muted">正本ルール＋4AI＋4回反復DRAWをブラウザへ統合する第1プレイアブル版</div></div>
<div class="panel controls">Seed <input id="seed" type="number" value="1" style="width:70px"> P1 <select id="ai1"><option>rush</option><option>ranged</option><option>raid</option><option>defense</option></select> P2 <select id="ai2"><option>ranged</option><option>rush</option><option>raid</option><option>defense</option></select><button id="new">DESTINY</button><button id="step">+3s</button><button id="start">START</button></div>
<div class="panel"><div id="board" class="board"></div></div>
<div class="stats"><div class="stat">TIME<br><b id="time"></b>s</div><div class="stat">P1<br><b id="p1"></b>pt</div><div class="stat">P2<br><b id="p2"></b>pt</div><div class="stat">TOWER<br>×<b id="towers"></b></div><div class="stat">SCORE<br><b id="score"></b></div><div class="stat">STALL<br><b id="stall"></b></div></div>
<div class="panel" style="margin-top:10px"><b>DEBUG</b><div id="log" class="log"></div></div></div>
<div id="overlay" class="hidden"><div class="result"><h1 id="resultTitle"></h1><div id="resultText"></div><button id="close" style="margin-top:15px">OK</button></div></div>
<script src="game_core.js"></script><script src="ui.js"></script></body></html>
