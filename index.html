<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luna Game Prototype</title><link rel="stylesheet" href="styles.css?v=report-v1"></head>
<body><div class="wrap"><div class="panel"><h2 style="margin:0">Luna Game — Canonical Prototype</h2><div class="muted">正本ルール＋4AI＋4回反復DRAWをブラウザへ統合する第1プレイアブル版</div></div>
<div class="panel controls"><label class="control">Seed <input id="seed" type="number" value="1" style="width:90px"></label><label class="control">P1 <select id="ai1"><option>rush</option><option>ranged</option><option>raid</option><option>defense</option></select></label><label class="control">P2 <select id="ai2"><option>ranged</option><option>rush</option><option>raid</option><option>defense</option></select></label><button id="new">DESTINY</button><button id="random">RANDOM</button><button id="step">+3s</button><button id="start">START</button></div>
<div class="panel"><div id="board" class="board"></div></div>
<div class="stats"><div class="stat">TIME<br><b id="time"></b>/<span id="limit"></span>s</div><div class="stat">P1<br><b id="p1"></b>pt</div><div class="stat">P2<br><b id="p2"></b>pt</div><div class="stat">TOWER<br>×<b id="towers"></b></div><div class="stat">TOWER SCORE<br><b id="score"></b></div><div class="stat">OBJECTIVES<br><b id="objectives"></b></div><div class="stat">STALL<br><b id="stall"></b></div></div>
<div class="rule"><span class="legend-tower">T = Tower</span> / <span class="legend-outpost">O = Outpost</span> — 180秒時は占領済み全拠点の合計が多い側の勝利</div>
<div class="panel" style="margin-top:10px"><b>DEBUG</b><div id="log" class="log"></div></div></div>
<div id="overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-describedby="resultText"><div class="result"><h1 id="resultTitle"></h1><div id="resultText"></div><div style="margin-top:15px"><button id="copy">COPY RESULT</button> <button id="close">OK</button></div><div id="copyStatus" class="muted" aria-live="polite" style="margin-top:8px"></div></div></div>
<script src="game_core.js?v=report-v1"></script><script src="ui.js?v=report-v1"></script></body></html>
