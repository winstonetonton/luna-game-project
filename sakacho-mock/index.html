<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>さかちょ 機能統合モック v3</title>
<style>
:root{--g:#167747;--gd:#0e5d36;--p:#f6faf7;--line:#d9e4dc;--ink:#172019;--muted:#67736a;--warn:#b65a00}*{box-sizing:border-box}body{margin:0;background:#e9f0ea;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}button,input,select,textarea{font:inherit}.phone{width:min(100%,430px);height:860px;margin:18px auto;background:#fff;border:1px solid #bac8bd;border-radius:30px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 22px 60px #23452c22}.head{min-height:64px;padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{display:flex;align-items:center;min-width:0;white-space:nowrap;font-size:18px;font-weight:900}.brand-mark{width:34px;height:34px;flex:0 0 34px;object-fit:contain;margin-right:6px}.brand small{font-size:11px;color:var(--muted);margin-left:5px}.context{font-size:12px;text-align:right;color:var(--muted)}main{flex:1;overflow:auto;background:#fbfdfb}.screen{padding:17px 16px 28px}.screen[hidden]{display:none}h1{font-size:23px;line-height:1.35;margin:0 0 7px}h2{font-size:17px;margin:22px 0 10px}h3{font-size:15px;margin:0 0 6px}p{line-height:1.55}.muted{font-size:13px;color:var(--muted);margin:4px 0 12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:11px 0}.hero{background:linear-gradient(135deg,#e5f6e9,#fff6d9);border:0}.notice{border-left:4px solid #e79927;background:#fff7e8;border-radius:9px;padding:11px 12px;font-size:13px;margin:0 0 12px}.ok{border-color:var(--g);background:#ecf8ef}.primary,.secondary,.danger,.line{width:100%;min-height:48px;padding:11px 13px;border-radius:12px;font-weight:850;border:1px solid transparent}.primary{background:var(--g);color:#fff}.secondary{background:#fff;border-color:#aebdb1;color:var(--ink)}.danger{background:#fff2ef;border-color:#efc5bc;color:#9d2c1b}.line{background:#06c755;color:#fff}.stack{display:grid;gap:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:13px;font-weight:800}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #aebbb0;border-radius:10px;background:#fff}.field textarea{min-height:72px}.list{width:100%;min-height:60px;padding:12px 3px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}.list strong,.list small{display:block}.list small{margin-top:4px;color:var(--muted)}.back,.text{min-height:44px;border:0;background:transparent;color:var(--gd);font-weight:850;padding:7px 0}.mini{min-height:44px;padding:8px 11px;border-radius:10px;border:1px solid #adbcaf;background:#fff;font-weight:800}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-weight:800}.chip[aria-pressed=true]{background:#e3f4e8;border-color:var(--g);color:var(--gd)}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal b{font-size:11px;color:var(--muted);padding:4px 0}.day{aspect-ratio:1;border:0;background:transparent;border-radius:9px;color:#9aa39c}.day.event{background:#e7f5eb;color:var(--gd);font-weight:900;border:1px solid #c6e1ce}.day.match{background:#fff0df;color:#9b4a00;border-color:#f0cfab}.day.today{box-shadow:inset 0 0 0 2px var(--g)}.answer{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.answer button{min-height:50px;border:1px solid #aebbb0;border-radius:12px;background:#fff;font-size:21px;font-weight:900}.answer button[aria-pressed=true]{background:#def3e5;border-color:var(--g)}.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}.tabs button{min-height:44px;white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800}.tabs button[aria-selected=true]{background:var(--g);color:#fff}.nav{flex:0 0 calc(71px + env(safe-area-inset-bottom));padding:6px 6px env(safe-area-inset-bottom);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);background:#fff}.nav[hidden]{display:none}.nav button{min-height:58px;border:0;background:transparent;border-radius:12px;color:#607067;font-size:11px;font-weight:850}.nav span{display:block;font-size:21px}.nav button[aria-current=page]{background:#e4f4e8;color:var(--gd)}.toast{position:absolute;left:13px;right:13px;bottom:84px;background:#172019;color:#fff;padding:12px 14px;border-radius:12px;font-size:13px;z-index:4}.toast[hidden]{display:none}.phone{position:relative}.error{color:#b22918;font-size:13px;font-weight:700}.status{font-size:12px;padding:5px 8px;border-radius:999px;background:#eef4ef;font-weight:800}.member{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:9px 0}.member-actions{display:flex;gap:5px}.member-actions button{min-width:44px;min-height:44px}.check{display:flex;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.check input{width:22px;height:22px}.lock-cta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.lock-cta small{display:block}.player-picker select{width:100%;min-height:46px;padding:9px;border:1px solid #aebbb0;border-radius:10px;background:#fff}.ad-slot{border:1px solid #d9ddda;background:#f7f8f7;color:#58605a;border-radius:10px;margin:12px 0;padding:8px 12px;text-align:left;display:flex;align-items:center;gap:10px}.ad-slot>span{font-size:10px;border:1px solid #bfc5c0;border-radius:3px;padding:2px 4px;color:#737a75}.ad-slot strong,.ad-slot small{display:block}.ad-slot strong{font-size:13px}.ad-slot small{font-size:11px;color:#7a817c}.ad-bottom{min-height:112px;align-items:flex-start;padding-top:17px;margin-top:26px;background:linear-gradient(135deg,#f7f8f7,#eef4ef)}@media(max-width:450px){body{background:#fff}.phone{height:100dvh;margin:0;border:0;border-radius:0}}
/* Mobile width containment: prevent native date controls and long rows from widening the app. */
html,body{width:100%;max-width:100%;overflow-x:hidden}
button,input,select,textarea{max-width:100%}
.phone,.head,main,.screen,.card,.stack,.field{min-width:0;max-width:100%}
main{width:100%;overflow-y:auto;overflow-x:hidden}
.screen{width:100%}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.field input,.field select,.field textarea,.primary,.secondary,.danger,.line,.list{min-width:0}
.list>span:first-child,.row>*,.check>span{min-width:0}
.list strong,.list small,p{overflow-wrap:anywhere}
@media(max-width:450px){.phone{width:100%;max-width:100%}}
input[type="date"],input[type="time"]{display:block;inline-size:100%;min-inline-size:0;max-inline-size:100%;-webkit-appearance:none;appearance:none}
input[type="date"]::-webkit-date-and-time-value,input[type="time"]::-webkit-date-and-time-value{min-width:0;text-align:left}
.date-chip{display:inline-flex;align-items:center;gap:7px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 8px 7px 12px;font-weight:850}
.date-chip .date-remove{width:30px;height:30px;border:0;border-radius:999px;background:#eef3ef;color:#526057;font-size:18px;line-height:1}
.date-schedule{display:grid;gap:9px;margin-top:12px}.date-row{border:1px solid var(--line);border-radius:13px;padding:11px;background:#f9fcfa}.date-row .muted{margin:2px 0 0}.date-row-actions{display:flex;gap:12px;flex-wrap:wrap}.date-row-actions .text{font-size:13px}.override-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.override-fields .field:last-child{grid-column:1/-1}
.month-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0}.month-head strong{font-size:17px}.month-head button{width:44px;height:44px;border:0;border-radius:999px;background:#eef5f0;color:var(--gd);font-size:23px}.pickcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.pickcal b{font-size:12px;color:var(--muted);padding:5px 0}.pickday{min-width:0;min-height:44px;border:1px solid transparent;border-radius:10px;background:#fff;color:var(--ink);font-weight:750;padding:0}.pickday[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff}.pickblank{min-height:44px}
.feature-list{display:grid;gap:10px}.feature{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:start;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff}.feature-icon{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#e5f4e9;color:var(--gd);font-size:19px}.feature p{margin:3px 0 0}.paid-plan{background:linear-gradient(135deg,#f3f7f4,#fff8e7);border-color:#d9c891}.paid-plan .status{background:#fff1bd;color:#725400}.event-checklist .check:last-child{border-bottom:0}.event-checklist .check{min-height:50px}.event-checklist input:checked+span{text-decoration:line-through;color:var(--muted)}
.item-editor{display:grid;gap:8px}.item-editor-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.item-editor-row:last-of-type{border-bottom:0}.item-remove{min-width:44px;min-height:44px;border:0;border-radius:999px;background:#f1f4f1;color:#526057;font-weight:900}.item-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px}.item-add input{min-width:0;padding:11px;border:1px solid #aebbb0;border-radius:10px}.check-progress{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.check-progress strong{color:var(--gd)}.check-complete{padding:10px 12px;border-radius:10px;background:#e8f7ec;color:var(--gd);font-weight:850;margin:0 0 10px}
.match-card{padding:0;overflow:hidden}.match-card .list{padding:13px 14px}.match-card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line)}.match-card-actions button{min-height:44px}.match-switcher{display:grid;gap:8px;margin:12px 0}.match-switcher button{text-align:left}.match-switcher button[aria-pressed=true]{background:#e3f4e8;border-color:var(--g);color:var(--gd)}
</style></head><body>

const eventItems=e=>(Array.isArray(e.items)?e.items:String(e.items||'').split('・')).map(x=>x.trim()).filter(Boolean);
const eventItemKey=(eventId,player,item)=>[eventId,player,item].join('|');
const visibleEvents=()=>S.role==='creator'&&S.createdPage?.eventIds?.length?S.events.filter(e=>S.createdPage.eventIds.includes(e.id)):S.events;
function matchData(eventId=S.eventId){const id=eventId||visibleEvents().find(e=>e.type==='match')?.id||'m920';S.matchByEvent[id]??={answers:{},cars:[],items:{テント:false,救急箱:false,ビブス:false}};return S.matchByEvent[id]}
function eventChecklist(e){const items=eventItems(e),done=items.filter(item=>S.eventItemChecks[eventItemKey(e.id,S.selected,item)]).length;return `<h2>${esc(S.selected)}さんの持ち物</h2><div class="card event-checklist"><div class="check-progress"><span>準備できたものをチェック</span><strong>${done} / ${items.length}</strong></div>${done===items.length&&items.length?'<p class="check-complete">✓ 持ち物の準備が完了しました</p>':''}${items.map(item=>{const key=eventItemKey(e.id,S.selected,item);return `<label class="check"><input type="checkbox" data-event-item="${esc(item)}" ${S.eventItemChecks[key]?'checked':''}><span>${esc(item)}</span></label>`}).join('')}</div>`}
function draftItems(d){d.items??=(d.kind==='practice'?['水筒','すね当て','ボール']:['ユニフォーム','昼食','水筒']);return `<div class="card item-editor"><h3>持ち物チェックリスト</h3><p class="muted">保護者が準備しながらチェックできます。</p>${d.items.map((item,i)=>`<div class="item-editor-row"><strong>${esc(item)}</strong><button class="item-remove" aria-label="${esc(item)}を削除" data-remove-draft-item="${i}">×</button></div>`).join('')}<div class="item-add"><input data-in="draftitem" placeholder="例：タオル"><button class="mini" data-act="draft-item-add">追加</button></div><p class="error" data-item-error></p></div>`}
function landing(){return `<section class="screen"><div class="card hero"><h1>練習も試合も、かんたん管理。</h1><p>出欠・配車・持ち物・結果をひとつのページにまとめられます。</p><div class="notice ok"><strong>会員登録なしですぐ作成</strong><br>保護者の回答にも登録は不要です。</div><button class="primary" data-route="create-kind">登録なしでページを作る</button></div><div class="card"><h2 style="margin-top:0">作成者・管理者の方</h2><p>かんたん無料登録すると、閲覧鍵を設定して見られる方を制限できます。</p><p class="muted">作成ページの一覧表示や別端末からの編集もできます。</p><button class="secondary" data-route="login">ログイン</button><button class="text" data-route="register">無料会員登録はこちら</button></div><div class="card paid-plan"><div class="row"><h2 style="margin:0">有料プラン</h2><span class="status">準備中</span></div><p><strong>有料登録するとデータが1年間保存されます。</strong></p><p class="muted">広告なし・過去の予定検索・データ書き出しも提供予定です。</p></div><button class="text" data-route="key">サンプルのチーム共有ホームを見る</button><h2>さかちょでできること</h2><div class="feature-list"><div class="feature"><span class="feature-icon">⚽</span><div><strong>練習・試合をかんたん管理</strong><p class="muted">予定と出欠をひとつのページで確認できます。</p></div></div><div class="feature"><span class="feature-icon">✓</span><div><strong>持ち物と試合要項を共有</strong><p class="muted">荷物チェックリストや試合要項をアップロードして共有できます。</p></div></div><div class="feature"><span class="feature-icon">▶</span><div><strong>試合動画を分かりやすく整理</strong><p class="muted">YouTube URLを試合ごとにまとめて共有できます。</p></div></div></div></section>`}
function login(register=false){return `<section class="screen">${backBtn()}<h1>${register?'無料会員登録':'ログイン'}</h1><p class="muted">会員登録はページを管理する方だけ。保護者の回答には不要です。</p><div class="field"><label>メールアドレス</label><input type="email" data-in="email" value="${esc(S.login.email)}" placeholder="name@example.com"></div><div class="field"><label>パスワード</label><input type="password" data-in="password" value="${esc(S.login.password)}" placeholder="8文字以上"></div><p class="error" data-auth-error></p><button class="primary" data-act="${register?'register':'login'}">${register?'無料会員登録する':'ログインする'}</button>${register?'':'<button class="text" data-route="register">アカウントを作る</button>'}</section>`}
function key(){return `<section class="screen">${backBtn()}<h1>${S.teamLocked?'閲覧鍵を入力':'チーム共有ページ'}</h1><p class="muted">大井ジュニアSCの共有ページ</p>${S.teamLocked?'<div class="field"><label>閲覧鍵</label><input data-in="viewkey" inputmode="numeric" placeholder="サンプル：1234"></div><p class="error" data-key-error></p>':''}<button class="primary" data-act="unlock">ページを開く</button></section>`}
function createKind(){return `<section class="screen">${backBtn()}<h1>何を作りますか？</h1><div class="two"><button class="card" data-kind="practice"><h3>⚽ 練習</h3><p class="muted">複数日の出欠</p></button><button class="card" data-kind="match"><h3>🏁 試合</h3><p class="muted">配車・持ち物・資料</p></button></div></section>`}
function practiceDateRows(d){d.practiceOverrides??={};return d.practiceDates.length?`<div class="date-schedule">${d.practiceDates.map(x=>{const o=d.practiceOverrides[x],editing=d.editingPracticeDate===x;return `<div class="date-row"><div class="row"><div><strong>${dateLabel(x)}</strong><p class="muted">${o?`${esc(o.start)}〜${esc(o.end)}・${esc(o.place)}`:'共通の時間・場所を使用'}</p></div><button type="button" class="date-remove" data-remove-practice-date="${x}" aria-label="${dateLabel(x)}を削除">×</button></div>${editing?`<div class="override-fields"><div class="field"><label>この日の開始</label><input type="time" data-override-field="start" data-override-date="${x}" value="${esc(o.start)}"></div><div class="field"><label>この日の終了</label><input type="time" data-override-field="end" data-override-date="${x}" value="${esc(o.end)}"></div><div class="field"><label>この日の場所</label><input data-override-field="place" data-override-date="${x}" value="${esc(o.place)}"></div></div><button class="secondary" data-done-practice-date="${x}">個別設定を完了</button>`:`<div class="date-row-actions"><button class="text" data-edit-practice-date="${x}">${o?'個別設定を変更':'この日だけ変更'}</button>${o?`<button class="text" data-reset-practice-date="${x}">共通設定に戻す</button>`:''}</div>`}</div>`}).join('')}</div>`:'<p class="muted">まだ練習日が選択されていません。</p>'}
function practiceCalendar(d){d.calendarMonth??=d.practiceDates[0]?.slice(0,7)||'2026-09';const [y,m]=d.calendarMonth.split('-').map(Number),days=new Date(y,m,0).getDate(),offset=new Date(y,m-1,1).getDay();let cells='<div class="pickcal">'+['日','月','火','水','木','金','土'].map(x=>'<b>'+x+'</b>').join('')+Array.from({length:offset},()=>'<span class="pickblank"></span>').join('');for(let n=1;n<=days;n++){const iso=`${y}-${String(m).padStart(2,'0')}-${String(n).padStart(2,'0')}`,selected=d.practiceDates.includes(iso);cells+=`<button type="button" class="pickday" data-toggle-practice-date="${iso}" aria-pressed="${selected}" aria-label="${dateLabel(iso)}${selected?' 選択中':'を選択'}">${n}</button>`}return `<div class="month-head"><button type="button" data-calendar-move="-1" aria-label="前の月">‹</button><strong>${y}年${m}月</strong><button type="button" data-calendar-move="1" aria-label="次の月">›</button></div>${cells}</div>`}
function createForm(){const d=S.draft,k=d.kind==='practice';d.endTime??='12:00';d.practiceOverrides??={};return `<section class="screen">${backBtn()}<h1>${S.editEventId?'予定を編集':(k?'練習':'試合')+'ページを作る'}</h1><div class="field"><label>タイトル</label><input data-draft="title" value="${esc(d.title)}"></div>${k?`<div class="card"><h3>共通の時間・場所</h3><p class="muted">選択するすべての練習日に適用します。</p><div class="two"><div class="field"><label>開始時間</label><input type="time" data-draft="time" value="${d.time}"></div><div class="field"><label>終了時間</label><input type="time" data-draft="endTime" value="${d.endTime}"></div></div><div class="field"><label>場所</label><input data-draft="place" value="${esc(d.place)}"></div></div><div class="card"><h3>練習日を選ぶ</h3><p class="muted">日付をタップすると、同じ月から何日でも選べます。もう一度タップすると解除できます。</p>${practiceCalendar(d)}<p><strong>選択中 ${d.practiceDates.length}日</strong></p>${practiceDateRows(d)}<button class="text" data-act="copy-practice-dates">前回の日程をコピー</button></div>`:`<div class="field"><label>試合日</label><input type="date" data-draft="date" value="${d.date}"></div><div class="field"><label>開始時間</label><input type="time" data-draft="time" value="${d.time}"></div><div class="field"><label>場所</label><input data-draft="place" value="${esc(d.place)}"></div>`}${draftItems(d)}${S.registered?`<label class="check"><input type="checkbox" data-draft="locked" ${d.locked?'checked':''}><span><strong>閲覧鍵を使う</strong><small class="muted">一度ONにすると次回も初期値ON</small></span></label>`:`<div class="lock-cta"><span><strong>閲覧鍵を使う</strong><small class="muted">無料会員登録後に利用できます</small></span><button class="mini" data-act="register-for-key">無料会員登録</button></div>`}${d.locked?'<div class="field"><label>閲覧鍵</label><input data-draft="key" value="'+esc(d.key)+'"></div>':''}<p class="error" data-create-error></p><button class="primary" data-act="create-save">${S.editEventId?'変更を保存':'ページを作成'}</button></section>`}
function complete(){const c=S.createdPage;return `<section class="screen"><h1>${c.added?'予定を追加しました':esc(c.title)+'を作成しました'}</h1><p class="muted">${c.added?'同じチームページとカレンダーに反映しました。':'作成ページを確認してから共有できます。'}</p><div class="card"><h3>共有URL</h3><p>${esc(c.publicUrl)}</p><button class="mini" data-act="copy-public">コピー</button><h3 style="margin-top:16px">秘密の管理URL</h3><p>${esc(c.adminUrl)}</p><button class="mini" data-act="copy-admin">コピー</button></div><div class="stack"><button class="primary" data-act="open-created">${c.added?'チームページで確認':'作成したページを見る'}</button><button class="line" data-act="share">LINEで共有する</button><button class="secondary" data-route="email-once">管理URLをメールへ1回送信</button><button class="secondary" data-act="edit-created">作成内容を編集</button>${S.registered?'<button class="secondary" data-route="admin">管理画面を開く</button>':'<button class="secondary" data-route="register">無料会員登録して保存する</button>'}</div></section>`}
function emailOnce(){return `<section class="screen">${backBtn()}<h1>管理URLを1回送信</h1><div class="notice">送信後、メールアドレスは保持しません。</div><div class="field"><label>送信先メール</label><input type="email" data-in="sendemail" placeholder="name@example.com"></div><p class="error" data-email-error></p><button class="primary" data-act="email-send">管理URLを送信</button></section>`}
function calendar(){const events=visibleEvents();let h='<div class="cal">'+['日','月','火','水','木','金','土'].map(x=>'<b>'+x+'</b>').join('')+'<div class="day blank"></div><div class="day blank"></div>';for(let i=1;i<=30;i++){const e=events.find(x=>x.day===i);h+=e?`<button class="day event ${e.type==='match'?'match':''}" data-event="${e.id}" aria-label="9月${i}日 ${e.title}">${i}</button>`:`<div class="day" aria-label="9月${i}日 予定なし">${i}</div>`}return h+'</div>'}
function playerStatus(){const p=S.selected,r=S.responses[p]||{};const cards=visibleEvents().slice(0,3).map(e=>`<button class="list" data-event="${e.id}"><span><strong>${e.date} ${esc(e.title)}</strong><small>${r[e.id]==='未'||!r[e.id]?'未回答':'出欠 '+r[e.id]}${e.type==='match'&&S.match.answers[p]?.transport?'・'+esc(S.match.answers[p].transport):''}</small></span><span>›</span></button>`).join('');return `<h2>${esc(p)}さんの出欠状況（直近3件）</h2><div class="card">${cards||'<p class="muted">予定はありません。</p>'}</div><button class="text" data-route="my-status">出欠状況をすべて見る</button>`}
function creatorActions(){return ['admin','creator'].includes(S.role)?`<div class="card"><h3>予定を追加</h3><p class="muted">同じチームページとカレンダーに追加されます。</p><div class="two"><button class="primary" data-kind="practice">＋ 練習を追加</button><button class="secondary" data-kind="match">＋ 試合を追加</button></div></div>`:''}
function team(){const next=visibleEvents()[0];return `<section class="screen"><div class="row"><div><h1>大井ジュニアSC</h1><p class="muted">U-12・チーム共有ホーム</p></div>${S.role==='admin'?'<button class="mini" data-route="admin">管理</button>':''}</div>${creatorActions()}<div class="notice"><strong>重要な変更</strong><br>${esc(S.notice)}</div><div class="card"><h3>回答する選手</h3><div class="row"><select data-player>${allPlayers().map(x=>`<option ${x===S.selected?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="mini" data-route="member-pick">回答する選手を選ぶ</button></div></div><h2>次の予定</h2>${next?`<button class="card list" data-event="${next.id}"><span><strong>${next.date} ${next.title}</strong><small>集合 ${next.meet}／${next.time}<br>${next.place}／${eventItems(next).map(esc).join('・')}</small></span><span>›</span></button>`:'<div class="card"><p class="muted">予定はありません。</p></div>'}<h2>9月のカレンダー</h2><div class="card">${calendar()}</div><button class="secondary" data-route="all">練習・試合をすべて見る</button>${playerStatus()}<h2>チームからのお知らせ</h2>${S.posts.slice(0,1).map(x=>`<button class="list" data-post="${x.id}"><span><strong>${esc(x.title)}</strong><small>${esc(x.body)}${S.readPosts.includes(x.id)?'・確認済み':''}</small></span><span>›</span></button>`).join('')}</section>`}
function memberPick(){return `<section class="screen">${backBtn()}<h1>回答する選手を選ぶ</h1><p class="muted">回答する選手を選びます。</p><div class="card">${allPlayers().map(x=>`<button class="list" data-pick="${esc(x)}"><span><strong>${esc(x)}</strong><small>${x===S.selected?'現在選択中':'この選手に切り替える'}</small></span><span>›</span></button>`).join('')}</div><h2>チームに選手を追加</h2><p class="muted">追加した名前はチーム全員に表示されます。</p><div class="field"><label>選手名</label><input data-in="quickmember" placeholder="例：健太"></div><button class="primary" data-act="quick-add">チームに選手を追加して選択</button></section>`}
function all(){return `<section class="screen">${backBtn()}<h1>練習・試合をすべて見る</h1><div class="tabs"><button aria-selected="true" data-filter="all">すべて</button><button data-filter="practice">練習</button><button data-filter="match">試合</button></div><div data-all-list>${eventList('all')}</div></section>`}function eventList(f){return visibleEvents().filter(e=>f==='all'||e.type===f).map(e=>`<button class="list" data-event="${e.id}"><span><strong>${e.date} ${esc(e.title)}</strong><small>${e.time}・${e.place}</small></span><span>›</span></button>`).join('')||'<p class="card muted">該当する予定はありません。</p>'}
function myStatus(){return `<section class="screen">${backBtn()}<h1>${esc(S.selected)}さんの出欠状況</h1>${visibleEvents().map(e=>`<button class="list" data-event="${e.id}"><span><strong>${e.date} ${esc(e.title)}</strong><small>${S.responses[S.selected]?.[e.id]||'未回答'}</small></span><span>›</span></button>`).join('')||'<p class="card muted">予定はありません。</p>'}</section>`}
function practice(){const ps=visibleEvents().filter(e=>e.type==='practice');return `<section class="screen"><h1>練習</h1><p class="muted">日付を選ぶと、参加者と選択中の選手の回答を確認できます。</p>${ps.map(e=>`<button class="list" data-event="${e.id}"><span><strong>${e.date} ${e.title}</strong><small>${e.time}・${e.place}／${S.selected}：${S.responses[S.selected]?.[e.id]||'未'}</small></span><span>›</span></button>`).join('')||'<p class="card muted">作成した練習日はありません。</p>'}</section>`}
function detail(){const e=S.events.find(x=>x.id===S.eventId)||S.events[0],isM=e.type==='match',r=S.responses[S.selected]?.[e.id]||'未',groups={'○':[],'△':[],'×':[],'未':[]},editing=(S.role==='admin'||S.role==='creator')&&S.detailEdit?.id===e.id,d=S.detailEdit;S.members.forEach(p=>groups[S.responses[p]?.[e.id]||'未'].push(p));return `<section class="screen">${backBtn()}<div class="row"><h1>${e.date} ${esc(e.title)}</h1>${(S.role==='admin'||S.role==='creator')&&!editing?'<button class="mini" data-act="detail-edit">集合・時間・場所を編集</button>':''}</div>${S.role!=='admin'?adUnit('top'):''}${editing?`<div class="card"><h3>この日の集合・時間・場所</h3><div class="field"><label>集合時間</label><input type="time" data-detail-field="meet" value="${esc(d.meet)}"></div><div class="two"><div class="field"><label>開始時間</label><input type="time" data-detail-field="start" value="${esc(d.start)}"></div><div class="field"><label>終了時間</label><input type="time" data-detail-field="end" value="${esc(d.end)}"></div></div><div class="field"><label>集合場所</label><input data-detail-field="place" value="${esc(d.place)}"></div><p class="error" data-detail-error></p><div class="stack"><button class="primary" data-act="detail-save">変更を保存</button><button class="secondary" data-act="detail-cancel">キャンセル</button></div></div>`:`<div class="card"><p><strong>集合時間</strong> ${e.meet}</p><p><strong>活動時間</strong> ${e.time}</p><p><strong>集合場所</strong> ${esc(e.place)}</p></div>`}${!isM?`<h2>参加予定</h2><div class="card"><p><strong>○ ${groups['○'].length}人</strong>　${groups['○'].map(esc).join('、')||'なし'}</p><p><strong>△ ${groups['△'].length}人</strong>　${groups['△'].map(esc).join('、')||'なし'}</p><p><strong>× ${groups['×'].length}人</strong>　${groups['×'].map(esc).join('、')||'なし'}</p><p><strong>未 ${groups['未'].length}人</strong>　${groups['未'].map(esc).join('、')||'なし'}</p></div>`:''}<h2>出欠を回答する選手</h2><div class="card player-picker"><label class="muted" for="detail-player">回答する選手</label><select id="detail-player" data-player>${allPlayers().map(x
